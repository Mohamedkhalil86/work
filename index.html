<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة الميدانية الذكي</title>
    <style>
        :root {
            /* لوحة ألوان متدرجة مبهرة */
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --gradient-2: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-3: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --gradient-4: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --gradient-dark: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-light: rgba(255, 255, 255, 0.05);
            
            --shadow-neon: 0 0 30px rgba(99, 102, 241, 0.5);
            --shadow-glow: 0 0 20px rgba(255, 255, 255, 0.2);
            --shadow-3d: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--gradient-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }


        /* شاشة تسجيل الدخول */
#auth-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--gradient-dark);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(50px);
}

.auth-card {
    background: rgba(255, 255, 255, 0.1);
    padding: 40px;
    border-radius: 30px;
    width: 90%;
    max-width: 400px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: var(--shadow-3d);
    text-align: center;
}

.auth-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.auth-tabs button {
    flex: 1;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

.auth-tabs button.active {
    background: var(--gradient-2);
}

.hidden { display: none !important; }

        /* خلفية نجوم متحركة */
       
        @keyframes stars {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        /* الأزرار العائمة - Neon Glow */
        .top-buttons-container {
          position: absolute;
    top: 40px;
    right: 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 1001;
        }

        .floating-btn {
             position: relative;
    border: none;
    padding: 12px 18px;
    border-radius: 40px;
    cursor: pointer;
    font-weight: 700;
    color: white;
    min-width: 180px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
    backdrop-filter: blur(25px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    overflow: hidden;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: var(--shadow-3d), var(--shadow-neon);
        }

        .floating-btn::before {
            content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: left 0.7s;
        }

        .floating-btn:hover::before { left: 100%; }
        .floating-btn:hover { 
            transform: translateY(-10px) scale(1.05) rotateX(10deg);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), var(--shadow-neon), var(--shadow-glow);
        }

        .btn-fetch { background: var(--gradient-2); border-color: rgba(79, 172, 254, 0.5); }
        .btn-gps { background: var(--gradient-4); border-color: rgba(250, 112, 154, 0.5); }
        .btn-clear { background: var(--gradient-dark); border-color: rgba(255,255,255,0.3); }
        .btn-external { background: var(--gradient-1); border-color: rgba(99, 102, 241, 0.5); }
        .btn-logout { background: var(--danger); border-color: rgba(239, 68, 68, 0.5); }

        /* الحاوية الرئيسية - 3D Glass */
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            border-radius: 40px;
            width: 100%;
            max-width: 850px;
            margin: 100px auto 50px;
            padding: 60px;
            box-shadow: 
                var(--shadow-3d),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-1);
            border-radius: 40px;
            padding: 2px;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .container:hover::before { opacity: 1; }

        /* العنوان الرئيسي - Neon Effect */
        h2 {
            text-align: center;
            background: linear-gradient(45deg, #fff, var(--secondary), #fff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 50px;
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px var(--secondary)); }
            to { filter: drop-shadow(0 0 40px var(--secondary)); }
        }

        h2::after {
            content: '';
            display: block;
            width: 120px;
            height: 8px;
            background: var(--gradient-3);
            margin: 25px auto 0;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(67, 233, 123, 0.6);
        }

        /* المدخلات - Floating Label Effect */
        .form-group {
            position: relative;
            margin-bottom: 35px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 35px;
        }

        input, select, textarea {
            width: 100%;
            padding: 22px 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        input::placeholder, select::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            transform: translateY(-3px) scale(1.02);
        }

        input[readonly] {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
            color: #fff;
            font-weight: 700;
        }

        /* البطاقات - 3D Flip Effect */
        .section-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 35px;
            margin-bottom: 40px;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
            overflow: hidden;
        }

        .section-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--gradient-2);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
        }

        .section-card:hover {
            transform: translateY(-15px) rotateX(5deg) rotateY(-5deg);
            box-shadow: 0 40px 80px rgba(0,0,0,0.3), var(--shadow-neon);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            margin-bottom: 25px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(15px);
            box-shadow: var(--shadow-glow);
        }

        /* Checkbox Grid */
        .grid-checkbox {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px 22px;
            border-radius: 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .check-item:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--secondary);
            transform: translateX(-8px);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.3);
        }

        .check-item input {
            width: 24px;
            height: 24px;
            accent-color: var(--secondary);
            transform: scale(1.2);
            cursor: pointer;
        }

        /* زر الإرسال - Ultimate Button */
        .submit-btn {
            background: var(--gradient-3);
            color: white;
            border: none;
            padding: 25px 40px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.4);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.8s;
        }

        .submit-btn:hover::before { left: 100%; }
        .submit-btn:hover {
            transform: translateY(-12px) scale(1.08);
            box-shadow: 0 40px 80px rgba(16, 185, 129, 0.6);
        }

        /* الإحصائيات */
        #analytics {
            display: none;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 45px;
            margin-top: 50px;
            box-shadow: var(--shadow-3d);
        }

        #analytics h4 {
            text-align: center;
            font-size: 2rem;
            background: var(--gradient-3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            font-weight: 800;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 25px 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            backdrop-filter: blur(20px);
        }

        .stat-item:hover {
            transform: scale(1.05);
            background: rgba(99, 102, 241, 0.2);
        }

        .stat-item b {
            font-size: 2.2rem;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
@media (max-width: 1300px) {

    /* الأزرار تبقى فوق */
    .top-buttons-container {
        position: relative; /* مهم جدًا بدل absolute */
        top: auto;
        right: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 20px auto;
        width: 100%;
    }

    .floating-btn {
        flex: 1 1 auto;
        min-width: 140px;
        max-width: 200px;
        padding: 10px 14px;
        font-size: 0.85rem;
    }

    .container {
        margin: 40px auto;
        padding: 30px 25px;
    }

    h2 {
        font-size: 2rem;
    }

    .form-row,
    .grid-checkbox {
        grid-template-columns: 1fr;
    }
}

/* ========================= */
/* موبايل */
/* ========================= */
@media (max-width: 768px) {

    .floating-btn {
        min-width: 120px;
        font-size: 0.8rem;
        padding: 8px 10px;
    }

    .container {
        margin: 30px 15px;
        padding: 25px 15px;
        border-radius: 25px;
    }

    h2 {
        font-size: 1.7rem;
    }
}
@media (max-width: 768px) {

    .section-card div[style*="space-around"] {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

}

/* موبايل صغير */
@media (max-width: 480px) {

    .section-card div[style*="space-around"] {
        grid-template-columns: 1fr;
    }

}
/* ========================= */
/* موبايل صغير جدًا */
/* ========================= */
@media (max-width: 480px) {

    .top-buttons-container {
        gap: 8px;
    }

    .floating-btn {
        flex: 1 1 100%;
        min-width: unset;
    }

    h2 {
        font-size: 1.5rem;
    }
}

/* تحسين التناسق */
html {
    font-size: 16px;
}

@media (max-width: 768px) {
    html {
        font-size: 14px;
    }
}
    </style>
</head>
<body>
<div id="auth-overlay">
    <div class="auth-card">
        <h2 id="auth-title" style="font-size: 1.8rem; margin-bottom: 20px;">دخول النظام</h2>
        
        <div class="auth-tabs">
            <button id="tab-login" class="active" onclick="switchAuth('login')">تسجيل دخول</button>
            <button id="tab-signup" onclick="switchAuth('signup')">إنشاء حساب</button>
        </div>

        <div id="auth-form">
            <input type="email" autocomplete="off" minlength="8" id="auth-email" placeholder="البريد الإلكتروني" style="margin-bottom: 15px;">
            <input type="password" minlength="8" autocomplete="off" id="auth-pass" placeholder="كلمة المرور" style="margin-bottom: 25px;">
            <button id="auth-btn" class="submit-btn" onclick="handleAuth()" style="padding: 15px;">دخول</button>
        </div>
        <p id="auth-msg" style="color: var(--danger); margin-top: 15px; font-size: 0.9rem;"></p>
    </div>
</div>
    <div class="top-buttons-container">
        <button type="button" class="floating-btn btn-fetch" onclick="getLocation()"> تحديد موقع العميل</button>
        <button type="button" class="floating-btn btn-gps" onclick="openDirectGPS()"> فتح خرائط جوجل</button>
        <button type="button" class="floating-btn btn-clear" onclick="clearSheetData()"> مسح بيانات اليوم</button>
        <button type="button" class="floating-btn btn-external" onclick="window.open('https://www.google.com/maps/d/edit?mid=1aHRvN93W7HS-AwEsIauaS22oYOSbJWA&usp=sharing', '_blank')">🌐 الإحداثيات </button>
        <button type="button" class="floating-btn btn-logout" onclick="logout()"> 🚪 تسجيل الخروج</button>
    </div>

<div class="container">
    <h2> تسجيل زيارة عميل</h2>
    
    <div class="form-row">
        <input type="text" id="lat"  placeholder="Lat">
        <input type="text" id="lng"  placeholder="Lng">
    </div>
    <input style="margin-bottom: 20px !important;" type="text" id="address" placeholder="العنوان المكتشف">
    
    <div class="form-row">
        <input type="text" id="name" placeholder="اسم العميل">
        <input type="tel" id="phone" placeholder="رقم الهاتف">
    </div>
    
    <select style="margin-bottom: 30px !important;" id="status">
        <option disabled selected hidden value="">-- حالة العميل --</option>
        <option style="color: #000000 !important;" value="متعامل">متعامل </option>
        <option style="color: #000000 !important;" value="غير متعامل">غير متعامل </option>
    </select>

    <div class="section-card">
        <span class="section-title"> تصنيف العميل</span>
        <div style="display: flex; justify-content: space-around;">
            <label class="check-item"><input type="radio" name="cat" value="A"> فئة A</label>
            <label class="check-item"><input type="radio" name="cat" value="B"> فئة B</label>
            <label class="check-item"><input type="radio" name="cat" value="C"> فئة C</label>
        </div>
    </div>

    <div class="section-card">
        <span class="section-title"> المنافسين</span>
        <div class="grid-checkbox">
            <label class="check-item"><input type="checkbox" name="comp" value="دومتي"> دومتي</label>
            <label class="check-item"><input type="checkbox" name="comp" value="رودس"> رودس</label>
            <label class="check-item"><input type="checkbox" name="comp" value="لافاش"> لافاش</label>
            <label class="check-item"><input type="checkbox" name="comp" value="عبور لاند"> عبور لاند</label>
             <label class="check-item"><input type="checkbox" name="comp" value=" ابو الولد">  ابو الولد</label>
              <label class="check-item"><input type="checkbox" name="comp" value=" كيري">  كيري</label>
        </div>
    </div>

    <div class="section-card">
        <span class="section-title"> منتجاتنا التي يتعامل معها العميل</span>
        <div class="grid-checkbox">
            <label class="check-item"><input type="checkbox" name="prod" value="مثلثات"> مثلثات</label>
            <label class="check-item"><input type="checkbox" name="prod" value="تتراباك"> تتراباك</label>
            <label class="check-item"><input type="checkbox" name="prod" value="شيدر"> شيدر</label>
            <label class="check-item"><input type="checkbox" name="prod" value="كاسات"> كاسات</label>
             <label class="check-item"><input type="checkbox" name="prod" value="موتزاريلا"> موتزاريلا</label>
              <label class="check-item"><input type="checkbox" name="prod" value="جرادل"> جرادل</label>
        </div>
    </div>

    <textarea style="margin-bottom: 30px !important;" id="problems" rows="3" placeholder="الملاحظات..."></textarea>
    <button id="submitBtn" class="submit-btn" onclick="sendData()">إرسال التقرير </button>
    <div id="status-msg"></div>

    <div id="analytics">
        <h4 style="margin:0 0 15px 0; text-align:center;">📊 ملخص إحصائيات اليوم</h4>
        <div style="color: #00f2fe;" class="stat-item"><span>الزيارات:</span> <b id="totalVal">0</b></div>
        <div style="color: #00f2fe;" class="stat-item"><span>المتعاملين:</span> <b id="activeVal">0</b></div>
        <div style="color: #00f2fe;" class="stat-item"><span>التغطية:</span> <b id="coverageVal">0%</b></div>
    </div>
</div>

<script>
    // رابط السكريبت الخاص بك
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwaW45tPMAesbhhLP3xUGNUqKB3a65UW_J0PW7MEnXkoSBTJ5ueM4KLFsxJL3fbFSTk/exec';

    // 1. تحديد الموقع
    function getLocation() {
        if (navigator.geolocation) {
            document.getElementById('status-msg').innerText = "⏳ جاري تحديد الموقع...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lng').value = pos.coords.longitude;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
                    const data = await res.json();
                    document.getElementById('address').value = data.display_name || "موقع مكتشف";
                    document.getElementById('status-msg').innerText = "✅ تم جلب الموقع";
                } catch(e) { 
                    document.getElementById('status-msg').innerText = "✅ تم جلب الإحداثيات"; 
                }
            }, (error) => {
                alert("يرجى تفعيل الـ GPS في المتصفح");
            });
        }
    }

    // 2. فتح الخرائط (تم تعديل الرابط ليعتمد على الإحداثيات الحالية في الحقول)
    function openDirectGPS() {
        const lat = document.getElementById('lat').value;
        const lng = document.getElementById('lng').value;
        if (lat && lng) {
            // استخدام رابط جوجل ماب المباشر الموثوق
            window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank');
        } else {
            alert("حدد الموقع أولاً");
        }
    }

    // 3. مسح البيانات (تم تعديلها لتعمل POST)
    async function clearSheetData() {
        const pass = prompt("أدخل كلمة المرور لمسح بيانات اليوم:");
        if (!pass) return;

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // لضمان الإرسال حتى لو لم يدعم السيرفر CORS
                body: JSON.stringify({
                    action: "clearSheet",
                    pass: pass
                })
            });
            
            // ملاحظة: مع 'no-cors' لا يمكن قراءة الرد، لذا سنفترض النجاح أو ننتظر ثوانٍ
            alert("🚀 تم إرسال طلب المسح (تأكد من الشيت بعد ثوانٍ)");
            location.reload();
        } catch (e) { 
            alert("خطأ في الاتصال"); 
        }
    }

    // 4. إرسال بيانات الزيارة
    async function sendData() {
        const btn = document.getElementById('submitBtn');
        const comps = Array.from(document.querySelectorAll('input[name="comp"]:checked')).map(c => c.value).join(' - ');
        const prods = Array.from(document.querySelectorAll('input[name="prod"]:checked')).map(p => p.value).join(' - ');
        const cat = document.querySelector('input[name="cat"]:checked')?.value || "N/A";

        const payload = {
            action: "sendData", // إضافة تمييز للعملية
            lat: document.getElementById('lat').value, 
            lng: document.getElementById('lng').value,
            name: document.getElementById('name').value, 
            address: document.getElementById('address').value,
            customerPhone: document.getElementById('phone').value, 
            status: document.getElementById('status').value,
            competitor: comps, 
            products: prods, 
            category: cat, 
            problems: document.getElementById('problems').value
        };

        if(!payload.name || !payload.lat) return alert("أكمل البيانات أولاً (الاسم والموقع)");
        
        btn.disabled = true; 
        btn.innerText = "جاري الحفظ...";
        
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            if(result.result === "success") {
                document.getElementById('analytics').style.display = "block";
                document.getElementById('totalVal').innerText = result.stats.total;
                document.getElementById('activeVal').innerText = result.stats.active;
                document.getElementById('coverageVal').innerText = result.stats.coverage;
                alert("🚀 تم الحفظ بنجاح!");
                // تفريغ الحقول
                document.querySelectorAll('input:not([readonly]), textarea, select').forEach(i => i.value = '');
                document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(i => i.checked = false);
            }
        } catch (e) { 
            alert("تم الإرسال بنجاح (يرجى التحقق من الشيت)"); 
        }
        btn.disabled = false; 
        btn.innerText = "إرسال التقرير النهائي 🚀";
    }

    // 5. نظام الدخول
    let authMode = 'login';

    function switchAuth(mode) {
        authMode = mode;
        document.getElementById('auth-title').innerText = mode === 'login' ? 'دخول النظام' : 'حساب جديد';
        document.getElementById('auth-btn').innerText = mode === 'login' ? 'دخول' : 'إنشاء الحساب';
        document.getElementById('tab-login').classList.toggle('active', mode === 'login');
        document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
    }

    async function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        const msg = document.getElementById('auth-msg');
        const btn = document.getElementById('auth-btn');

        if (!email || !pass) return alert("يرجى ملء البيانات");

        btn.disabled = true;
        btn.innerText = "جاري المعالجة...";
if (pass.length < 8) {
            msg.innerText = "❌ يجب أن تكون كلمة المرور 8 أرقام أو رموز على الأقل";
            return;
        }
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: authMode,
                    email: email,
                    password: pass
                })
            });

            const result = await response.json();

            if (result.result === "success") {
                document.getElementById('auth-overlay').classList.add('hidden');
                alert(authMode === 'login' ? "✅ تم الدخول بنجاح" : "✅ تم إنشاء الحساب بنجاح");
            } else {
                msg.innerText = "❌ " + (result.message || "خطأ في البيانات");
            }
        } catch (e) {
            msg.innerText = "⚠️ تم الدخول (تجريبي)";
            document.getElementById('auth-overlay').classList.add('hidden');
        }
        
        btn.disabled = false;
        btn.innerText = authMode === 'login' ? 'دخول' : 'إنشاء الحساب';
    }

    // 6. وظيفة تسجيل الخروج
    function logout() {
        if(confirm("هل تريد تسجيل الخروج؟")) {
            document.getElementById('auth-overlay').classList.remove('hidden');
            // مسح الحقول للأمان
            document.getElementById('auth-email').value = '';
            document.getElementById('auth-pass').value = '';
        }
    }
</script>
